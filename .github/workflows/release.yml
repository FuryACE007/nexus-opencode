name: Release Nexus CLI

# Trigger: push a version tag (v1.2.3) OR run manually from the Actions tab
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to tag (e.g. 1.3.13)"
        required: true
        type: string

permissions:
  contents: write  # needed to create releases and upload assets

jobs:
  build:
    name: Build binaries
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Install Bun (only needed on the CI runner — not on developer machines)
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      # Build self-contained binaries for all platforms.
      # Output goes to packages/opencode/dist/:
      #   nexus-darwin-arm64      ← Mac M1/M2/M3
      #   nexus-darwin-x64        ← Mac Intel
      #   nexus-windows-x64.exe   ← Windows 64-bit
      - name: Build CLI binaries
        run: bun run packages/opencode/script/build.ts
        env:
          OPENCODE_VERSION: ${{ inputs.version || github.ref_name }}

      # Flatten and rename binaries from opencode-target/bin/opencode to nexus-target
      - name: Rename binaries to nexus
        run: |
          cd packages/opencode/dist
          # Mac
          [ -f "opencode-darwin-arm64/bin/opencode" ] && mv "opencode-darwin-arm64/bin/opencode" "nexus-darwin-arm64"
          [ -f "opencode-darwin-x64/bin/opencode" ] && mv "opencode-darwin-x64/bin/opencode" "nexus-darwin-x64"
          
          # Windows
          # Bun compile might or might not have .exe depending on environment, build.ts uses "opencode"
          if [ -f "opencode-windows-x64/bin/opencode" ]; then
            mv "opencode-windows-x64/bin/opencode" "nexus-windows-x64.exe"
          elif [ -f "opencode-windows-x64/bin/opencode.exe" ]; then
            mv "opencode-windows-x64/bin/opencode.exe" "nexus-windows-x64.exe"
          fi
          
          if [ -f "opencode-windows-x64-baseline/bin/opencode" ]; then
            mv "opencode-windows-x64-baseline/bin/opencode" "nexus-windows-x64-baseline.exe"
          elif [ -f "opencode-windows-x64-baseline/bin/opencode.exe" ]; then
            mv "opencode-windows-x64-baseline/bin/opencode.exe" "nexus-windows-x64-baseline.exe"
          fi

      # Determine the release tag from the push event or the manual input
      - name: Determine tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=v${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          fi

      # Create the GitHub Release and attach all binaries
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: "Nexus CLI ${{ steps.tag.outputs.tag }}"
          generate_release_notes: true
          files: |
            packages/opencode/dist/nexus-darwin-arm64
            packages/opencode/dist/nexus-darwin-x64
            packages/opencode/dist/nexus-windows-x64.exe
            packages/opencode/dist/nexus-windows-x64-baseline.exe
          body: |
            ## Install

            ### Mac (Apple Silicon — M1/M2/M3)
            ```bash
            curl -L -o /usr/local/bin/nexus \
              https://github.com/${{ github.repository }}/releases/download/${{ steps.tag.outputs.tag }}/nexus-darwin-arm64
            chmod +x /usr/local/bin/nexus
            nexus --version
            ```

            ### Mac (Intel)
            ```bash
            curl -L -o /usr/local/bin/nexus \
              https://github.com/${{ github.repository }}/releases/download/${{ steps.tag.outputs.tag }}/nexus-darwin-x64
            chmod +x /usr/local/bin/nexus
            nexus --version
            ```

            ### Windows (PowerShell)
            ```powershell
            $dir = "$env:LOCALAPPDATA\Programs\nexus"
            if (!(Test-Path $dir)) { New-Item -ItemType Directory -Path $dir }
            Invoke-WebRequest `
              -Uri "https://github.com/${{ github.repository }}/releases/download/${{ steps.tag.outputs.tag }}/nexus-windows-x64.exe" `
              -OutFile "$dir\nexus.exe"
            [Environment]::SetEnvironmentVariable("Path", $env:Path + ";$dir", "User")
            # Restart terminal, then:
            nexus --version
            ```
