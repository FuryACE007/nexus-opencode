name: Release Nexus CLI

# Trigger: push a version tag (v1.2.3) OR run manually from the Actions tab
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to tag (e.g. 1.3.13)"
        required: true
        type: string

permissions:
  contents: write  # needed to create releases and upload assets

jobs:
  build:
    name: Build binaries
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}

    steps:
      - uses: actions/checkout@v4

      # Install Bun (only needed on the CI runner — not on developer machines)
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      # Build self-contained binaries for Mac (arm64, x64) and Windows (x64).
      # Output goes to packages/opencode/dist/nexus-{target}/bin/nexus{.exe}
      - name: Build CLI binaries
        run: bun run packages/opencode/script/build.ts
        env:
          OPENCODE_VERSION: ${{ inputs.version || github.ref_name }}

      # Upload raw Windows CLI binary before bundling so the Electron job can use it as a sidecar
      - name: Upload Windows CLI binary
        uses: actions/upload-artifact@v4
        with:
          name: nexus-windows-cli
          path: packages/opencode/dist/nexus-windows-x64/bin/nexus.exe

      # Flatten Mac binaries; build Windows zip bundle with .opencode/ + setup script
      - name: Flatten binary structure
        run: |
          cd packages/opencode/dist

          # --- Mac: flat binaries ---
          cp nexus-darwin-arm64/bin/nexus  /tmp/nexus-darwin-arm64
          cp nexus-darwin-x64/bin/nexus    /tmp/nexus-darwin-x64

          rm -rf nexus-darwin-arm64 nexus-darwin-x64

          mv /tmp/nexus-darwin-arm64  .
          mv /tmp/nexus-darwin-x64    .

          # --- Windows: zip bundle (nexus.exe + .opencode/ + setup.ps1) ---
          # @opencode-ai/plugin is a workspace-only package — not published to npm.
          # Copy it from the workspace node_modules (resolved by root bun install above)
          # directly into .opencode/node_modules so the bundle is self-contained.
          # -rL dereferences bun's symlinks so actual files are copied, not symlink stubs.
          mkdir -p "$GITHUB_WORKSPACE/.opencode/node_modules/@opencode-ai"
          cp -rL "$GITHUB_WORKSPACE/node_modules/@opencode-ai/plugin" \
                 "$GITHUB_WORKSPACE/.opencode/node_modules/@opencode-ai/"

          mkdir -p nexus-windows-bundle
          cp nexus-windows-x64/bin/nexus.exe nexus-windows-bundle/nexus.exe
          cp -r "$GITHUB_WORKSPACE/.opencode" nexus-windows-bundle/.opencode
          cp "$GITHUB_WORKSPACE/nexus/setup-windows.ps1" nexus-windows-bundle/setup.ps1
          cp "$GITHUB_WORKSPACE/nexus/install.bat" nexus-windows-bundle/install.bat
          rm -rf nexus-windows-x64

          cd nexus-windows-bundle
          zip -r ../nexus-windows-x64.zip .
          cd ..
          rm -rf nexus-windows-bundle

          echo "Final dist contents:"
          ls -lh

      # Determine the release tag from the push event or the manual input
      - name: Determine tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=v${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          fi

      # Create the GitHub Release and attach CLI binaries.
      # The Electron desktop installer is uploaded by the build-electron-windows job.
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: "Nexus CLI ${{ steps.tag.outputs.tag }}"
          generate_release_notes: true
          files: |
            packages/opencode/dist/nexus-darwin-arm64
            packages/opencode/dist/nexus-darwin-x64
            packages/opencode/dist/nexus-windows-x64.zip
          body: |
            ## Install

            ### Mac (Apple Silicon — M1/M2/M3)
            ```bash
            curl -L -o /usr/local/bin/nexus \
              https://github.com/${{ github.repository }}/releases/download/${{ steps.tag.outputs.tag }}/nexus-darwin-arm64
            chmod +x /usr/local/bin/nexus
            nexus --version
            ```

            ### Mac (Intel)
            ```bash
            curl -L -o /usr/local/bin/nexus \
              https://github.com/${{ github.repository }}/releases/download/${{ steps.tag.outputs.tag }}/nexus-darwin-x64
            chmod +x /usr/local/bin/nexus
            nexus --version
            ```

            ### Windows — CLI (PowerShell)
            ```powershell
            # 1. Download and extract the zip
            $zip = "$env:TEMP\nexus-windows.zip"
            Invoke-WebRequest `
              -Uri "https://github.com/${{ github.repository }}/releases/download/${{ steps.tag.outputs.tag }}/nexus-windows-x64.zip" `
              -OutFile $zip
            Expand-Archive -Path $zip -DestinationPath "$env:TEMP\nexus-setup" -Force

            # 2. Run the setup script (installs config + binary + PATH)
            powershell.exe -ExecutionPolicy Bypass -File "$env:TEMP\nexus-setup\setup.ps1"

            # rare scenario (step 2)
            Get-Content "$env:TEMP\nexus-setup\setup.ps1" | powershell.exe -noprofile -

            # 3. Open a new terminal, then:
            nexus --version
            ```

            ### Windows — Desktop App
            Download `nexus-desktop-win-x64.exe` from the assets below and run it.
            Requires the CLI to be installed first (see Windows CLI instructions above).

  build-electron-windows:
    name: Build Electron Windows installer
    needs: build
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      # Download the raw nexus.exe built by the build job and place it as the
      # electron sidecar. electron-builder packages it into the installer as
      # resources/opencode-cli.exe which the desktop app launches at runtime.
      - name: Download Windows CLI binary
        uses: actions/download-artifact@v4
        with:
          name: nexus-windows-cli
          path: packages/desktop-electron/resources

      - name: Rename CLI binary to sidecar name
        shell: pwsh
        run: Rename-Item "packages\desktop-electron\resources\nexus.exe" "opencode-cli.exe"

      # electron-vite build — prebuild hook copies prod icons automatically
      - name: Build Electron app
        working-directory: packages/desktop-electron
        env:
          OPENCODE_CHANNEL: prod
        run: bun run build

      # Package NSIS installer — skip auto-publish, we upload manually below
      - name: Package Windows installer
        working-directory: packages/desktop-electron
        env:
          OPENCODE_CHANNEL: prod
        run: bunx electron-builder --win --config electron-builder.config.ts --publish never

      # Rename to nexus-branded artifact before uploading
      - name: Rename installer
        shell: pwsh
        run: |
          $src = Get-ChildItem "packages\desktop-electron\dist\opencode-electron-win-*.exe" | Select-Object -First 1
          Rename-Item $src.FullName "nexus-desktop-win-x64.exe"

      - name: Upload desktop installer to GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload ${{ needs.build.outputs.tag }} packages/desktop-electron/dist/nexus-desktop-win-x64.exe --clobber
